[project]
name = "date-tool-mcp"
version = "0.1.0"
description = "A minimal MCP server exposing a get_today tool, usable by any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anyueduzou", url = "https://github.com/Anyueduzou/date-tool-mcp" }
]
keywords = ["mcp", "date", "tool"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.28.1",
]

[project.urls]
Homepage = "https://github.com/Anyueduzou/date-tool-mcp"
Repository = "https://github.com/Anyueduzou/date-tool-mcp"

[project.scripts]
date-tool-mcp = "date_tool_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/date_tool_mcp"]
